[project]
name = "handschrifterkennung-mnist"
version = "0.1.0"
description = "Handschrifterkennung mit MNIST — MLP, Visualisierung und Fehleranalyse"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "seaborn>=0.12",
    "pandas>=2.0",
    "streamlit>=1.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
